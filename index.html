<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stellar Timepiece</title>
    <meta name="description" content="A visually stunning, elegant digital clock.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300&display=swap" rel="stylesheet">

    <style>
        :root {
            --c-void:      #050505;
            --c-gold-hi:   #F0D080;
            --c-gold-mid:  #C9A227;
            --c-gold-deep: #7A5C1E;
            --c-ivory:     #FAF6ED;
        }

        *, *::before, *::after {
            margin: 0; padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .noise {
            position: fixed; inset: 0; pointer-events: none; z-index: 10;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
            background-size: 180px 180px; opacity: 0.6;
        }

        body {
            background: var(--c-void);
            min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            color: var(--c-ivory);
            font-family: 'Jost', sans-serif;
            overflow: hidden;
        }

        .zen-container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: clamp(2rem, 8vh, 6rem);
            padding: env(safe-area-inset-top,   1.5rem)
                     env(safe-area-inset-right,  1.5rem)
                     env(safe-area-inset-bottom, 1.5rem)
                     env(safe-area-inset-left,   1.5rem);
            opacity: 0;
            animation: zenFadeIn 2.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes zenFadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Greeting ── */
        .greeting-layer {
            display: flex; align-items: center; gap: 0.55em;
        }
        .greeting {
            font-size: clamp(0.75rem, 3.5vw, 0.95rem);
            font-weight: 200;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            opacity: 0.38;
        }

        /* ── Beating heart ── */
        .heart {
            display: inline-block;
            font-size: clamp(0.8rem, 3.5vw, 1rem);
            line-height: 1;
            transform-origin: center;
            animation: heartbeat 1.6s ease-in-out infinite;
            filter: drop-shadow(0 0 4px rgba(200, 50, 50, 0.5));
        }
        @keyframes heartbeat {
            0%   { transform: scale(1);    }
            8%   { transform: scale(1.30); }
            16%  { transform: scale(1);    }
            26%  { transform: scale(1.20); }
            38%  { transform: scale(1);    }
            100% { transform: scale(1);    }
        }

        /* ── Clock digits ── */
        .time-wrapper {
            font-family: 'Cormorant Garamond', serif;
            /* Bigger on mobile: floor raised from 5rem → 6.5rem, vw from 22 → 27 */
            font-size: clamp(6.5rem, 27vw, 17rem);
            font-weight: 300;
            font-style: italic;
            /* Extra vertical room so italic ascenders/descenders aren't clipped */
            line-height: 1.15;
            padding: 0.05em 0 0.1em;
            display: flex; align-items: center;
            background: linear-gradient(162deg,
                var(--c-ivory)     0%,
                var(--c-gold-hi)  35%,
                var(--c-gold-mid) 65%,
                var(--c-gold-deep) 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 40px rgba(201, 162, 39, 0.12));
        }
        .time-segment { display: inline-block; min-width: 0.56em; text-align: center; }

        .colon {
            margin: 0 0.05em 0.06em;
            opacity: 0.22;
            font-style: normal;
            font-weight: 200;
            /* Override gradient transparency so the colon is visible */
            -webkit-text-fill-color: var(--c-gold-hi);
            color: var(--c-gold-hi);
            animation: colonBlink 2s step-end infinite;
        }
        @keyframes colonBlink {
            0%, 100% { opacity: 0.22; }
            50%      { opacity: 0.07; }
        }

        /* ── Date ── */
        .date-layer {
            font-size: clamp(0.65rem, 3vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            opacity: 0.3;
            text-transform: uppercase;
            text-align: center;
        }

        @media (max-width: 480px) {
            .greeting   { letter-spacing: 0.25em; }
            .date-layer { letter-spacing: 0.18em; }
        }

        @media (prefers-reduced-motion: reduce) {
            .zen-container { animation: none; opacity: 1; }
            .heart, .colon { animation: none; }
        }
    </style>
</head>
<body>
    <div class="noise" aria-hidden="true"></div>
    <div class="zen-container">
        <header class="greeting-layer">
            <p class="greeting">Happy Women's Day, Alina</p>
            <span class="heart" aria-label="love">❤️</span>
        </header>
        <main class="time-layer">
            <div class="time-wrapper">
                <span id="hours"   class="time-segment">00</span>
                <span class="colon" aria-hidden="true">:</span>
                <span id="minutes" class="time-segment">00</span>
            </div>
        </main>
        <footer class="date-layer">
            <div id="date"></div>
        </footer>
    </div>

    <script>
        const hoursEl   = document.getElementById('hours');
        const minsEl    = document.getElementById('minutes');
        const dateEl    = document.getElementById('date');
        const heartEl   = document.querySelector('.heart');
        const DATE_OPTS = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

        function updateClock() {
            const now = new Date();
            hoursEl.textContent = String(now.getHours()).padStart(2, '0');
            minsEl.textContent  = String(now.getMinutes()).padStart(2, '0');
            dateEl.textContent  = now.toLocaleDateString('en-US', DATE_OPTS);
        }

        let tickTimeout  = null;
        let tickInterval = null;

        function startClock() {
            updateClock();
            heartEl.style.animationPlayState = 'running';
            const now = new Date();
            const msToNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
            tickTimeout = setTimeout(() => {
                updateClock();
                tickInterval = setInterval(updateClock, 60000);
            }, msToNextMinute);
        }

        function stopClock() {
            clearTimeout(tickTimeout);
            clearInterval(tickInterval);
            heartEl.style.animationPlayState = 'paused';
        }

        document.addEventListener('visibilitychange', () => {
            document.hidden ? stopClock() : startClock();
        });

        startClock();
    </script>
</body>
</html>

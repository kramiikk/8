<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stellar Timepiece</title>
    <meta name="description" content="A visually stunning, elegant digital clock.">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="noise"></div>
    <div class="zen-container">
        <header class="greeting-layer">
            <p class="greeting">Happy Women's Day, Alina</p>
            <span class="heart" aria-label="love">❤️</span>
        </header>

        <main class="time-layer">
            <div class="time-wrapper">
                <span id="hours" class="time-segment">00</span>
                <span class="colon" aria-hidden="true">:</span>
                <span id="minutes" class="time-segment">00</span>
            </div>
        </main>

        <footer class="date-layer">
            <div id="date">Sunday, March 8, 2026</div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
